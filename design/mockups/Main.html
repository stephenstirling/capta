<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capta — capture overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
.tb{background:transparent;border:0;cursor:pointer}
.tb:hover{background:rgba(255,255,255,0.08)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #1A1F27; font-family: 'Segoe UI Variable Text','Segoe UI',Manrope,system-ui,sans-serif; color: #ECEEF1">

<div style="position: absolute; left: 120px; top: 110px; width: 780px; height: 600px; background: #20252D; border: 1px solid #323843; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 36px; background: #1A1E25; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid #2C323C">
<div style="width: 120px; height: 8px; border-radius: 4px; background: #3A414D"></div>
</div>
<div style="flex-grow: 1; display: flex">
<div style="width: 190px; background: #1C2128; padding: 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

<div style="width: 75%; height: 8px; border-radius: 4px; background: #3A414D"></div>
<div style="width: 50%; height: 8px; border-radius: 4px; background: #3A414D"></div>
</div>
<div style="flex-grow: 1; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="width: 260px; height: 14px; border-radius: 7px; background: #4A5260"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="height: 150px; border-radius: 10px; background: #2A313B"></div>
<div style="height: 150px; border-radius: 10px; background: #2F3743"></div>
<div style="height: 150px; border-radius: 10px; background: #2F3743"></div>
<div style="height: 150px; border-radius: 10px; background: #2A313B"></div>
</div>
<div style="width: 90%; height: 8px; border-radius: 4px; background: #343B46"></div>
<div style="width: 70%; height: 8px; border-radius: 4px; background: #343B46"></div>
</div>
</div>
</div>

<div style="position: absolute; left: 860px; top: 240px; width: 470px; height: 470px; background: #EEF0F3; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 36px; background: #E0E3E8"></div>
<div style="padding: 32px; display: flex; flex-direction: column; gap: 14px">
<div style="width: 55%; height: 14px; border-radius: 7px; background: #9AA2AE"></div>
<div style="width: 95%; height: 8px; border-radius: 4px; background: #C6CBD3"></div>
<div style="width: 88%; height: 8px; border-radius: 4px; background: #C6CBD3"></div>
<div style="width: 92%; height: 8px; border-radius: 4px; background: #C6CBD3"></div>
<div style="width: 60%; height: 8px; border-radius: 4px; background: #C6CBD3"></div>
<div style="height: 140px; border-radius: 8px; background: #D5DAE1; margin-top: 10px"></div>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 100%; height: 48px; background: #12151A; border-top: 1px solid #232830; display: flex; justify-content: center; align-items: center; gap: 8px">
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
<div style="width: 32px; height: 32px; border-radius: 6px; background: #2A303A"></div>
</div>

<div style="position: absolute; left: 300px; top: 190px; width: 680px; height: 430px; border: 2px solid {{accent}}; box-sizing: border-box; box-shadow: 0 0 0 3000px rgba(5,6,8,0.62)">
<div style="position: absolute; left: 33.33%; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.22)"></div>
<div style="position: absolute; left: 66.66%; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,0.22)"></div>
<div style="position: absolute; top: 33.33%; left: 0; height: 1px; width: 100%; background: rgba(255,255,255,0.22)"></div>
<div style="position: absolute; top: 66.66%; left: 0; height: 1px; width: 100%; background: rgba(255,255,255,0.22)"></div>
<div style="position: absolute; left: -7px; top: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; right: -7px; top: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; left: -7px; bottom: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; right: -7px; bottom: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; left: calc(50% - 7px); top: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; left: calc(50% - 7px); bottom: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; top: calc(50% - 7px); left: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; top: calc(50% - 7px); right: -7px; width: 12px; height: 12px; background: #FFFFFF; border: 2px solid {{accent}}; border-radius: 3px"></div>
<div style="position: absolute; top: -40px; left: -2px; background: {{accent}}; color: #1A1206; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px">680 × 430 px</div>
</div>

<div style="position: absolute; left: 1000px; top: 636px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: 132px; height: 132px; border-radius: 66px; border: 3px solid #FFFFFF; overflow: hidden; position: relative; background-color: #2B2F36; background-image: linear-gradient(rgba(255,255,255,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.09) 1px, transparent 1px); background-size: 12px 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.5)">
<div style="position: absolute; left: 0; top: 0; width: 60px; height: 60px; background: #3A414D"></div>
<div style="position: absolute; left: 60px; top: 0; width: 12px; height: 72px; background: {{accent}}"></div>
<div style="position: absolute; left: 0; top: 60px; width: 72px; height: 12px; background: {{accent}}"></div>
<div style="position: absolute; left: 59px; top: 59px; width: 12px; height: 12px; border: 2px solid #FFFFFF; box-sizing: content-box; margin: -1px"></div>
</div>
<div style="background: rgba(20,23,28,0.95); border: 1px solid #343A44; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px; color: #D7DBE0">
<span>980, 620</span>
<span style="width: 10px; height: 10px; border-radius: 2px; background: #2B2F36; border: 1px solid #5A616C"></span>
<span>#2B2F36</span>
</div>
</div>

<div style="position: absolute; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: rgba(24,27,32,0.94); backdrop-filter: blur(20px); border: 1px solid #343A44; border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); font-size: 13px; font-weight: 600; white-space: nowrap">
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; background: {{accent}}; color: #1A1206; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"></rect></svg>Region</button>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path></svg>Window</button>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>Full screen</button>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16c-2-3 0-9 5-10s9 2 8 6-6 3-7 6 2 4 4 3"></path></svg>Freeform</button>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M12 8v8M9 13l3 3 3-3"></path></svg>Scrolling</button>
<div style="width: 1px; height: 26px; background: #3A404A; margin: 0 4px"></div>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>Record</button>
<div style="width: 1px; height: 26px; background: #3A404A; margin: 0 4px"></div>
<button class="tb" style="height: 44px; padding: 0 12px; border-radius: 11px; display: flex; align-items: center; gap: 6px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>No delay<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button class="tb" style="height: 44px; padding: 0 14px; border-radius: 11px; display: flex; align-items: center; gap: 8px; color: #D7DBE0; font: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M8 9h8M12 9v7"></path></svg>Grab text</button>
<div style="width: 1px; height: 26px; background: #3A404A; margin: 0 4px"></div>
<button class="tb" aria-label="Capture settings" style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #D7DBE0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
<button class="tb" aria-label="Cancel capture" style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #D7DBE0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; font-size: 12px; color: #C9CED6; white-space: nowrap">
<span>Drag to select</span>
<span><span style="font-family: 'JetBrains Mono',Consolas,monospace; background: #2A2F37; border: 1px solid #3D434D; border-radius: 5px; padding: 2px 6px">Space</span> move</span>
<span><span style="font-family: 'JetBrains Mono',Consolas,monospace; background: #2A2F37; border: 1px solid #3D434D; border-radius: 5px; padding: 2px 6px">Shift</span> square</span>
<span><span style="font-family: 'JetBrains Mono',Consolas,monospace; background: #2A2F37; border: 1px solid #3D434D; border-radius: 5px; padding: 2px 6px">Enter</span> capture</span>
<span><span style="font-family: 'JetBrains Mono',Consolas,monospace; background: #2A2F37; border: 1px solid #3D434D; border-radius: 5px; padding: 2px 6px">Esc</span> cancel</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5EC8FF","#A795FF","#5FD3A5"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFB547' };
}
}
</script>
</body>
</html>
