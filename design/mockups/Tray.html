<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capta — tray flyout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
.ib{background:transparent;border:0;cursor:pointer;color:#C9CED6}
.ib:hover{background:rgba(255,255,255,0.06)}
</style>
</helmet>
<div style="width: 380px; height: 560px; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column; gap: 16px; background: #1A1D21; border: 1px solid #2E333A; border-radius: 14px; font-family: 'Segoe UI Variable Text','Segoe UI',Manrope,system-ui,sans-serif; color: #ECEEF1">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M3 9V5.5A2.5 2.5 0 0 1 5.5 3H9M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9" stroke="#FFB547" stroke-width="2.6"></path><path d="M3 15v3.5A2.5 2.5 0 0 0 5.5 21H9M21 15v3.5a2.5 2.5 0 0 1-2.5 2.5H15" stroke="#F0962E" stroke-width="2.6"></path><circle cx="12" cy="12" r="4.2" fill="#3A4D70"></circle><circle cx="12" cy="12" r="1.8" fill="#FFB547"></circle></svg>
<span style="font-size: 15px; font-weight: 700; flex-grow: 1">Capta</span>
<button class="ib" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 76px; border: 0; border-radius: 12px; cursor: pointer; background: {{accent}}; color: #1A1206; font: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"></rect></svg>
<span style="display: flex; width: 100%; justify-content: space-between; font-size: 13px; font-weight: 700">Region<span style="font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; font-weight: 600">PrtSc</span></span></button>
<button class="ib" style="height: 76px; border-radius: 12px; background: #23272C; color: #ECEEF1; font: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path></svg>
<span style="display: flex; width: 100%; justify-content: space-between; font-size: 13px; font-weight: 600">Window<span style="font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; color: #A7AEB8">Alt+PrtSc</span></span></button>
<button class="ib" style="height: 76px; border-radius: 12px; background: #23272C; color: #ECEEF1; font: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
<span style="font-size: 13px; font-weight: 600">Full screen</span></button>
<button class="ib" style="height: 76px; border-radius: 12px; background: #23272C; color: #ECEEF1; font: inherit; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 12px 14px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
<span style="font-size: 13px; font-weight: 600">Record video</span></button>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #A7AEB8; flex-grow: 1">Delay</span>
<div style="display: flex; padding: 3px; background: #111317; border-radius: 10px; gap: 2px">
<button style="height: 32px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; background: #33383F; color: #ECEEF1">Off</button>
<button class="ib" style="height: 32px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 12px">3s</button>
<button class="ib" style="height: 32px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 12px">5s</button>
<button class="ib" style="height: 32px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 12px">10s</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8B93A0">Recent</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #F1F2F4"></div>
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #2A313B"></div>
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #22262D"></div>
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #2A2F38"></div>
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #EEF0F3"></div>
<div style="aspect-ratio: 4 / 3; border-radius: 8px; background: #DCE6F2"></div>
</div>
</div>

<a href="Ocula.dc.html" style="height: 44px; border-radius: 10px; background: #23272C; color: #ECEEF1; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
Open all captures in Ocula</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5EC8FF","#A795FF","#5FD3A5"]},"$preview":{"width":380,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FFB547' };
}
}
</script>
</body>
</html>
