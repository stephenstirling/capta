<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocula — Captures smart folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFB547}a:hover{color:#FFD08A}
.ib{background:transparent;border:0;cursor:pointer;color:#C9CED6}
.ib:hover{background:rgba(255,255,255,0.06)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #0F1114; font-family: 'Segoe UI Variable Text','Segoe UI',Manrope,system-ui,sans-serif; color: #ECEEF1; overflow: hidden; border-radius: 10px; border: 1px solid #262A30; box-sizing: border-box">

<div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; padding-left: 14px; gap: 10px; background: #15171B">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEEF1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span style="font-size: 12px; font-weight: 700">Ocula</span>
<span style="flex-grow: 1"></span>
<button class="ib" aria-label="Switch to light theme" style="width: 44px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg></button>
<button class="ib" aria-label="Minimise" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14"></path></svg></button>
<button class="ib" aria-label="Maximise" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
<button class="ib" aria-label="Close" style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex-grow: 1; display: flex; min-height: 0">

<div style="width: 250px; flex-shrink: 0; background: #15171B; border-right: 1px solid #262A30; padding: 16px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8B93A0; padding: 6px 10px">Folders</div>
<button class="ib" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Pictures</button>
<button class="ib" style="height: 40px; padding: 0 10px 0 36px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Camera</button>
<button class="ib" style="height: 40px; padding: 0 10px 0 36px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Captures</button>
<button class="ib" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Desktop</button>
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8B93A0; padding: 18px 10px 6px">Smart folders</div>
<button class="ib" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; font-weight: 600; text-align: left; background: {{accentSoft}}; color: #ECEEF1">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M3 9V5.5A2.5 2.5 0 0 1 5.5 3H9M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9" stroke="#FFB547" stroke-width="2.6"></path><path d="M3 15v3.5A2.5 2.5 0 0 0 5.5 21H9M21 15v3.5a2.5 2.5 0 0 1-2.5 2.5H15" stroke="#F0962E" stroke-width="2.6"></path><circle cx="12" cy="12" r="4.2" fill="#3A4D70"></circle><circle cx="12" cy="12" r="1.8" fill="#FFB547"></circle></svg>
<span style="flex-grow: 1">All captures</span><span style="font-size: 12px; color: #A7AEB8; font-weight: 500">12</span></button>
<button class="ib" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M8 9h8M12 9v7"></path></svg>Captures with text</button>
<button class="ib" style="height: 40px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font: inherit; color: #D7DBE0; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>Recordings</button>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; padding: 20px 24px; gap: 16px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<div style="font-size: 22px; font-weight: 700; flex-grow: 1">All captures</div>
<label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; width: 300px; background: #1A1D21; border: 1px solid #2A2E35; border-radius: 10px; color: #8B93A0; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search text inside captures</span>
<input type="text" placeholder="Search text inside captures" style="background: transparent; border: 0; outline: none; color: #ECEEF1; font: inherit; font-size: 13px; flex-grow: 1">
</label>
</div>
<div style="display: flex; gap: 8px; font-size: 13px">
<button class="ib" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; font-weight: 600; background: #ECEEF1; color: #0F1114">All</button>
<button class="ib" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; border: 1px solid #2E333A">Region</button>
<button class="ib" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; border: 1px solid #2E333A">Window</button>
<button class="ib" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; border: 1px solid #2E333A">Video</button>
<button class="ib" style="height: 34px; padding: 0 14px; border-radius: 17px; font: inherit; border: 1px solid #2E333A">Has text</button>
<span style="flex-grow: 1"></span>
<span style="font-size: 12px; color: #8B93A0; align-self: center">Today</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 16px; overflow: hidden">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="12">
<button onClick="{{t.pick}}" aria-label="{{t.name}}" style="background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; color: inherit; font: inherit">
<div style="width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; background: {{t.bg}}; outline: {{t.ring}}; outline-offset: 2px; position: relative; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div style="height: 6px; width: 40%; border-radius: 3px; background: {{t.bar}}"></div>
<div style="flex-grow: 1; display: flex; gap: 6px">
<div style="width: 28%; border-radius: 4px; background: {{t.b1}}"></div>
<div style="flex-grow: 1; border-radius: 4px; background: {{t.b2}}"></div>
</div>
<sc-if value="{{t.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 8px; bottom: 8px; font-family: 'JetBrains Mono',Consolas,monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: rgba(10,11,13,0.8); color: #ECEEF1">{{t.length}}</span>
</sc-if>
</div>
<div>
<div style="font-size: 13px; font-weight: 600">{{t.name}}</div>
<div style="font-size: 12px; color: #8B93A0">{{t.app}} · {{t.time}}</div>
</div>
</button>
</sc-for>
</div>
</div>

<div style="width: 380px; flex-shrink: 0; background: #15171B; border-left: 1px solid #262A30; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; background: {{sel.bg}}; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="height: 8px; width: 40%; border-radius: 4px; background: {{sel.bar}}"></div>
<div style="flex-grow: 1; display: flex; gap: 10px">
<div style="width: 28%; border-radius: 6px; background: {{sel.b1}}"></div>
<div style="flex-grow: 1; border-radius: 6px; background: {{sel.b2}}"></div>
</div>
</div>
<div>
<div style="font-size: 17px; font-weight: 700">{{sel.name}}</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A7AEB8; margin-top: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M3 9V5.5A2.5 2.5 0 0 1 5.5 3H9M15 3h3.5A2.5 2.5 0 0 1 21 5.5V9" stroke="#FFB547" stroke-width="2.6"></path><path d="M3 15v3.5A2.5 2.5 0 0 0 5.5 21H9M21 15v3.5a2.5 2.5 0 0 1-2.5 2.5H15" stroke="#F0962E" stroke-width="2.6"></path><circle cx="12" cy="12" r="4.2" fill="#3A4D70"></circle><circle cx="12" cy="12" r="1.8" fill="#FFB547"></circle></svg>
Captured with Capta</div>
</div>
<div style="display: flex; gap: 8px">
<button style="flex-grow: 1; height: 40px; border: 0; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 700; background: {{accent}}; color: #1A1206; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></svg>Edit in Capta</button>
<button class="ib" aria-label="Copy image" style="width: 44px; height: 40px; border-radius: 10px; background: #23272C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
<button class="ib" aria-label="Share" style="width: 44px; height: 40px; border-radius: 10px; background: #23272C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v12M8 7l4-4 4 4"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: 96px 1fr; row-gap: 9px; font-size: 13px; padding-top: 4px; border-top: 1px solid #262A30; padding-top: 16px">
<span style="color: #8B93A0">Source app</span><span>{{sel.app}}</span>
<span style="color: #8B93A0">Window</span><span>{{sel.window}}</span>
<span style="color: #8B93A0">Mode</span><span>{{sel.mode}}</span>
<span style="color: #8B93A0">Size</span><span style="font-family: 'JetBrains Mono',Consolas,monospace; font-size: 12px">{{sel.size}}</span>
<span style="color: #8B93A0">Captured</span><span>Today, {{sel.time}}</span>
<span style="color: #8B93A0">Tags</span><span>{{sel.tags}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8B93A0">Text in image</div>
<div style="background: #1D2025; border: 1px solid #2A2E35; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; color: #C9CED6">{{sel.ocr}}</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5EC8FF","#A795FF","#5FD3A5"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 0 };
}
renderVals() {
const accent = this.props.accent ?? '#FFB547';
const items = [
{ name: 'Network settings', app: 'Settings', window: 'Network — Settings', mode: 'Window', size: '1280 × 816', time: '14:32', tags: 'settings, how-to', ocr: 'Network · Wi‑Fi Connected · Proxy server · Metered connection', bg: '#F1F2F4', bar: '#9AA2AE', b1: '#E2E7EE', b2: '#FFFFFF', video: false, length: '' },
{ name: 'Build output', app: 'Terminal', window: 'PowerShell', mode: 'Region', size: '920 × 540', time: '13:58', tags: 'dev', ocr: 'Build succeeded · 0 warnings · 0 errors', bg: '#1C2128', bar: '#5FD3A5', b1: '#2A313B', b2: '#232A33', video: false, length: '' },
{ name: 'Porta pinned folders', app: 'Porta', window: 'Start', mode: 'Region', size: '640 × 720', time: '13:41', tags: 'porta', ocr: 'Pinned · Work · Photography · Tools', bg: '#22262D', bar: '#A795FF', b1: '#343A44', b2: '#2C313A', video: false, length: '' },
{ name: 'Drag-to-pin demo', app: 'Porta', window: 'Start', mode: 'Video', size: '1280 × 720', time: '13:20', tags: 'porta, demo', ocr: 'No text found', bg: '#2A2F38', bar: '#FFB547', b1: '#3A404A', b2: '#323843', video: true, length: '0:24' },
{ name: 'Blog editor', app: 'Browser', window: 'Site admin', mode: 'Window', size: '1440 × 900', time: '12:55', tags: 'website', ocr: 'New post · Title · Publish', bg: '#EEF0F3', bar: '#4A5260', b1: '#D5DAE1', b2: '#FFFFFF', video: false, length: '' },
{ name: 'Container list', app: 'Browser', window: 'Server admin', mode: 'Region', size: '1100 × 620', time: '12:30', tags: 'server', ocr: 'Container Manager · Running', bg: '#DCE6F2', bar: '#2F6FEB', b1: '#C3D3E8', b2: '#F5F8FC', video: false, length: '' },
{ name: 'Error dialog', app: 'Ocula', window: 'Ocula', mode: 'Region', size: '480 × 220', time: '11:47', tags: 'bug', ocr: 'Could not read metadata for this file', bg: '#2B2328', bar: '#FF6B4A', b1: '#3A3036', b2: '#332A30', video: false, length: '' },
{ name: 'Colour picker', app: 'Capta', window: 'Capta', mode: 'Freeform', size: '360 × 360', time: '11:12', tags: 'design', ocr: 'No text found', bg: '#3A3340', bar: '#5EC8FF', b1: '#4A4252', b2: '#433B4A', video: false, length: '' },
{ name: 'Study notes', app: 'Notes', window: 'Chapter 3', mode: 'Scrolling', size: '1280 × 3420', time: '10:40', tags: 'study', ocr: '[NOTES TEXT]', bg: '#F6F4EE', bar: '#8A8577', b1: '#E8E4D8', b2: '#FFFFFF', video: false, length: '' },
{ name: 'Dashboard tile', app: 'Browser', window: 'Dashboard', mode: 'Region', size: '720 × 400', time: '10:15', tags: 'dashboard', ocr: '[METRIC NAME] · [VALUE]', bg: '#151A22', bar: '#4DA3FF', b1: '#1F2733', b2: '#1A222D', video: false, length: '' },
{ name: 'Menu animation', app: 'Porta', window: 'Start', mode: 'Video', size: '960 × 600', time: '09:52', tags: 'porta', ocr: 'No text found', bg: '#262B33', bar: '#5FD3A5', b1: '#363C46', b2: '#2E343D', video: true, length: '0:08' },
{ name: 'Receipt', app: 'Mail', window: 'Inbox', mode: 'Window', size: '800 × 1000', time: '09:18', tags: 'records', ocr: 'Order confirmation · Total', bg: '#FFFFFF', bar: '#1B1F24', b1: '#EEF0F3', b2: '#F7F8FA', video: false, length: '' }
];
const picked = this.state.picked;
const thumbs = items.map((it, i) => Object.assign({}, it, {
ring: i === picked ? '2px solid ' + accent : '1px solid #2A2E35',
pick: () => this.setState({ picked: i })
}));
return { accent: accent, accentSoft: accent + '24', thumbs: thumbs, sel: items[picked] };
}
}
</script>
</body>
</html>
