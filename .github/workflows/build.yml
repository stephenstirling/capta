# Compiles Capta the way README.md does and runs the unit tests, so a change that breaks either
# shows up on its PR. It doesn't package, sign or run the app.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v3

      - name: Build (Debug, x64)
        run: msbuild Capta.slnx -restore -m -p:Configuration=Debug -p:Platform=x64 -v:minimal

      - name: Test
        run: dotnet test tests/Capta.Tests/Capta.Tests.csproj -c Debug -p:Platform=x64
